groups:
  - template: vyos-vyos
    prefix: R
    topology: defined
    links:
      - R1, R2, R3
      - R1, R4
      - R3, R4
    link_type: l1
    features:
      - loopback:name=Loopback0
interfaces:
  - match: Loopback0
    address: 192.168.0.0/16
    mask: 32
    features:
      - ospf:area=0
  - match: Ethernet
    address: 10.0.0.0/8
    mask: auto
    features:
      - ospf:area=0
