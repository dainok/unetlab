groups:
  - template: vyos-vyos
    prefix: R
    count: 4
    features:
      - loopback:name=Loopback0
topologies:
  - type: full-mesh
    match:
      - R
interfaces:
  - match: Loopback0
    address: 192.168.0.1/16
    mask: 32
    features:
      - ospf:area=0
  - match: Ethernet
    address: 10.0.0.0/8
    mask: auto
    features:
      - ospf:area=0
