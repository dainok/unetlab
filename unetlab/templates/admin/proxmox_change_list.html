{% extends "admin/change_list.html" %}

{% block object-tools %}
    {{ block.super }}

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const rescanBtn = document.getElementById("rescan-btn");
      rescanBtn.addEventListener("click", function (e) {
        e.preventDefault();
        if (!confirm("Sei sicuro di voler eseguire il rescan globale?")) return;

        fetch("{{ rescan_url }}/", {
          method: "POST",
          headers: {
            "X-CSRFToken": getCookie("csrftoken"),
            "Content-Type": "application/json"
          }
        })
        .then(response => response.json())
        .then(data => {
          alert(data.message);
          if (data.success) location.reload();
        })
        .catch(error => {
          alert("Errore durante il rescan.");
          console.error("Errore AJAX:", error);
        });
      });

      // CSRF helper
      function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== "") {
          const cookies = document.cookie.split(";");
          for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + "=")) {
              cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
              break;
            }
          }
        }
        return cookieValue;
      }
    });
  </script>
    <li>
        <a href="{{ rescan_url }}" class="button">Rescan cluster LINK</a>
        <a href="#" id="rescan-btn" class="button">AJAX</a>
    </li>
{% endblock %}
