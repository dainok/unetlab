repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.raw|migrations|docker|venv|ntc_templates
      - id: end-of-file-fixer
        exclude: \.raw|migrations|docker|venv|ntc_templates
      - id: check-yaml
        exclude: \.raw|migrations|docker|venv|ntc_templates
      - id: check-added-large-files
        exclude: \.raw|migrations|docker|venv|ntc_templates
      - id: check-json
        exclude: \.raw|migrations|docker|venv|ntc_templates
      - id: sort-simple-yaml
        exclude: \.raw|migrations|docker|venv|library|ntc_templates
        files: \.yaml$|\.yml$
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [--format, parsable, --strict]
        exclude: \.raw|migrations|docker|venv|ntc_templates
  - repo: https://github.com/google/yamlfmt
    rev: v0.17.2
    hooks:
      - id: yamlfmt
        exclude: \.raw|migrations|docker|venv|ntc_templates
  - repo: https://github.com/tillig/json-sort-cli
    rev: v3.0.0
    hooks:
      - id: json-sort
        exclude: \.raw|migrations|docker|venv|ntc_templates
        args:
          - --autofix
          - --end-of-line=lf
          - --indent-size="    "
          - --indent-style=space
          - --insert-final-newline=true
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        exclude: \.raw|migrations|docker|venv|ntc_templates
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.5
    hooks:
      - id: bandit
        exclude: \.raw|migrations|docker|venv|ntc_templates|tests
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        exclude: \.raw|migrations|docker|venv|ntc_templates
  - repo: https://github.com/PyCQA/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        exclude: \.raw|migrations|docker|venv
  - repo: https://github.com/Riverside-Healthcare/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-django
        files: "unetlab/templates"
